<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mortgage Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="Content">
            <div class="Formulario">
                <div class="Title">
                    <h1>Mortgage Calculator</h1>
                    <span id="Borrar">Clear all</span>
                </div>
                <form>
                    <div class="Input--Container">
                        <label for="Amount">Mortgage Amount</label>
                        <input type="number" id="Amount" placeholder="Enter the amount" re>
                    </div>
                    <div class="Container--separator">
                        <div>
                            <label for="Term">Mortgage Term</label>
                            <input type="number" id="Term" placeholder="Enter the term">
                        </div>
                        <div>
                            <label for="Interest--rate">Interest Rate</label>
                            <input type="number" id="Interest--rate" placeholder="Enter the rate">
                        </div>
                    </div>
                    <div class="Input--Container">
                        <h3>Mortgage Type</h3>
                        <div>
                            <input type="checkbox" id="Repayment">
                            <label for="Repayment">Repayment</label>
                        </div>
                        <div>
                            <input type="checkbox" id="Interest--only">
                            <label for="Interest--only">Interest Only</label>
                        </div>
                    </div>
                    <div class="Input--Container">
                        <button>Calculate Repayment</button>
                    </div>
                </form>
            </div>
            <div class="Resultado--hipoteca">
                <div class="content--result" id="content--result">
                    <div>
                        <img src="../../query_stats_24dp_E8EAED_FILL0_wght400_GRAD0_opsz24.svg" alt="Logo">
                        <h3>Results shown here</h3>
                    </div>
                    <div>
                        <p>Complete the form and click "calculate repayments" to
                            see what your monthyl repayments would be
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
<script src="app.js"></script>
</html>
